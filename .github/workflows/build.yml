# Builds the APK on every push (and on demand): Actions → Build APK → Artifacts → WallDashboard-apk
name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      # the GitHub runner image already contains the Android SDK (ANDROID_HOME)
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build
        run: chmod +x gradlew && ./gradlew --no-daemon --stacktrace assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: WallDashboard-apk
          path: app/build/outputs/apk/release/*.apk
