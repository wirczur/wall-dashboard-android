# Builds the APK on every push (and on demand): Actions → Build APK → Artifacts → WallDashboard-apk
name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write   # publish the APK as a GitHub release
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      # the GitHub runner image already contains the Android SDK (ANDROID_HOME)
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build
        shell: bash
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      # errors as annotations (readable without downloading the log)
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          { grep -E '^e: |error:|What went wrong' -A12 build.log || tail -40 build.log; } | head -60 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        with:
          name: WallDashboard-apk
          path: app/build/outputs/apk/release/*.apk
      # every build on main → release "v<versionName>-<run>", APK as an asset (download it on the panel or from the PC)
      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v$VER-$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/release/app-release.apk "WallDashboard-$VER.apk"
          gh release create "$TAG" "WallDashboard-$VER.apk" --title "Wall Dashboard $VER (build $GITHUB_RUN_NUMBER)" --notes "Commit $GITHUB_SHA" --latest
